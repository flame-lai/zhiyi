version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: zhiyi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-zhiyi_root_2026}
      MYSQL_DATABASE: zhiyi_erp
      MYSQL_USER: zhiyi
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zhiyi_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: zhiyi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./zhiyi-server
      dockerfile: Dockerfile
    container_name: zhiyi-backend
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: zhiyi_erp
      MYSQL_USER: zhiyi
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zhiyi_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SA_TOKEN_SECRET: ${SA_TOKEN_SECRET:-zhiyi_secret_2026}
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    container_name: zhiyi-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./zhiyi-web/dist:/usr/share/nginx/html:ro

volumes:
  mysql_data:
  redis_data:
